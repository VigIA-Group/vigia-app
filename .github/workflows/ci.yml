name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run TypeScript compiler
        run: npm run type-check
        continue-on-error: false

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          # Opcional: Agrega EXPO_TOKEN como secret en GitHub para autenticación
          # token: ${{ secrets.EXPO_TOKEN }}

      - name: Run Expo Doctor
        run: npx expo-doctor
        continue-on-error: false
